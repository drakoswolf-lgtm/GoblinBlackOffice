[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "goblin-black-office"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "flask>=2.3",
    "gunicorn>=23,<24",
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.19,<2",
    "psycopg[binary]>=3.2,<4",
    "reportlab>=4.2,<5",
    "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
