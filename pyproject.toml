[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "goblin-black-office"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["flask>=2.3", "pillow>=12.3.0", "pytesseract>=0.3.13", "gunicorn>=21.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
