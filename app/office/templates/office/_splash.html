<div class="gbo-splash" data-gbo-splash hidden aria-hidden="true">
  <div class="gbo-splash-wall">
    <div class="gbo-charge" aria-label="Goblin Black Office startup charge">
      <div class="gbo-cylinder gbo-cylinder-left" aria-hidden="true"><span class="gbo-fluid"></span><span class="gbo-copper"></span></div>
      <div class="gbo-controller">
        <div class="gbo-controller-screen">
          <div class="gbo-progress-ring" data-progress-ring><span data-progress-value>0%</span></div>
          <strong data-progress-mode>LOADING</strong>
        </div>
        <div class="gbo-sticky" data-sticky>
          <b>LOAD-BEARING STICKY<br>DO NOT REMOVE</b>
          <span data-sticky-joke>Nothing important appears to be on fire.</span>
        </div>
      </div>
      <div class="gbo-cylinder gbo-cylinder-right" aria-hidden="true"><span class="gbo-fluid"></span><span class="gbo-copper"></span></div>
    </div>

    <div class="gbo-breach" aria-hidden="true"></div>
    <div class="gbo-access-door" aria-hidden="true">
      <div class="gbo-door-half gbo-door-left">
        <span class="gbo-door-mark gbo-door-mark-left"></span>
      </div>
      <div class="gbo-door-half gbo-door-right">
        <span class="gbo-door-mark gbo-door-mark-right"></span>
      </div>
      <div class="gbo-door-seam"></div>
    </div>
    <div class="gbo-whiteout" aria-hidden="true"></div>
  </div>
</div>
