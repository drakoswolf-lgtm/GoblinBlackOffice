<div class="gbo-splash" data-gbo-splash hidden aria-hidden="true">
  <div class="gbo-splash-wall">
    <video class="gbo-splash-film" data-gbo-film muted playsinline preload="auto" aria-hidden="true">
      <source src="/canon/startup/gbo-opening-mobile.mp4" type="video/mp4" media="(max-width: 700px)">
      <source src="/canon/startup/gbo-opening-desktop.mp4" type="video/mp4">
    </video>
    <button class="gbo-film-audio" type="button" data-gbo-film-audio hidden aria-pressed="false">ENABLE SOUND</button>

    <div class="gbo-charge" aria-label="Goblin Black Office startup charge"></div>

    <div class="gbo-boot-console">
      <div class="gbo-boot-line">
        <strong data-progress-mode>LOADING</strong>
        <span data-progress-value>0%</span>
      </div>
      <div class="gbo-progress-meter" data-progress-ring aria-hidden="true"></div>
      <div class="gbo-boot-joke" data-sticky-joke>Nothing important appears to be on fire.</div>
    </div>

    <div class="gbo-breach" aria-hidden="true"></div>
    <div class="gbo-access-door" aria-hidden="true"></div>
    <div class="gbo-whiteout" aria-hidden="true"></div>
  </div>
</div>
