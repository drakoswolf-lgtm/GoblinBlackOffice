<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Office setup · Goblin Black Office</title>
  <link rel="stylesheet" href="/static/gbo.css">
</head>
<body>
<main class="auth-shell">
  <section class="auth-card">
    <div class="brand"><span class="brand-mark">Æ</span><span>Æterna · Office Setup</span></div>
    <p class="eyebrow">Final setup</p>
    <h1>Name the place.</h1>
    <p class="lead">I only need the essentials before the specialists start touching paperwork.</p>
    {% if errors %}<div class="errors">{% for error in errors %}<div>{{ error }}</div>{% endfor %}</div>{% endif %}
    <form method="post">
      <label for="business-name">Business name</label>
      <input id="business-name" name="business_name" required placeholder="Your contracting company">
      <label for="currency">Reporting currency</label>
      <select id="currency" name="currency"><option>CAD</option><option>USD</option><option>EUR</option><option>GBP</option></select>
      <button type="submit">Open the Office</button>
    </form>
  </section>
</main>
</body>
</html>
