<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · Goblin Black Office</title>
  <link rel="stylesheet" href="/static/gbo.css">
</head>
<body>
<main class="auth-shell">
  <section class="auth-card">
    <a class="brand" href="/"><span class="brand-mark">GBO</span><span>Goblin Black Office</span></a>
    <p class="eyebrow">Secure office access</p>
    <h1>Enter the Office.</h1>
    <p class="lead">The paperwork has been unsupervised long enough.</p>
    {% if error %}<div class="errors">{{ error }}</div>{% endif %}
    <form method="post">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required autocomplete="current-password">
      <button type="submit">Sign in</button>
    </form>
    <p class="auth-foot">New to the private beta? <a href="/register">Create an account</a>.</p>
  </section>
</main>
</body>
</html>
